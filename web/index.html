<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NameCon - 轻量视频会议</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="home-container">
        <div class="home-logo">NameCon</div>
        <div class="home-subtitle">轻量级 WebRTC 视频会议</div>
        <div class="card-group">
            <div class="card">
                <h2>创建房间</h2>
                <input id="createName" type="text" placeholder="你的名字">
                <button class="btn-primary" onclick="createRoom()">创建房间</button>
                <div id="createStatus"></div>
            </div>
            <div class="card">
                <h2>加入房间</h2>
                <input id="joinName" type="text" placeholder="你的名字">
                <input id="roomId" type="text" placeholder="房间号 (6位数字)">
                <button class="btn-primary" onclick="joinRoom()">加入房间</button>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        async function createRoom() {
            const name = document.getElementById('createName').value || '房主';
            const resp = await api.createRoom(name);
            if (resp.room_id) {
                document.getElementById('createStatus').innerHTML =
                    `<div class="room-id-display">
                        <div class="label">房间号</div>
                        <div class="value">${resp.room_id}</div>
                    </div>`;
                localStorage.setItem('username', name);
                localStorage.setItem('roomId', resp.room_id);
                localStorage.setItem('token', resp.token);
                setTimeout(() => { window.location.href = '/room.html'; }, 1200);
            } else {
                document.getElementById('createStatus').innerHTML =
                    '<p style="color:var(--danger)">创建失败，请确认服务已启动</p>';
            }
        }
        async function joinRoom() {
            const name = document.getElementById('joinName').value || '参会者';
            const roomId = document.getElementById('roomId').value;
            if (!roomId) return alert('请输入房间号');
            localStorage.setItem('username', name);
            localStorage.setItem('roomId', roomId);
            window.location.href = '/room.html';
        }
    </script>
</body>
</html>
