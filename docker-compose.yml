services:
  media-svc:
    build:
      context: .
      dockerfile: deploy/Dockerfile.media-svc
    ports:
      - "10000:10000/udp"
    environment:
      - PUBLIC_IP=${PUBLIC_IP:-127.0.0.1}
    restart: unless-stopped

  signal-svc:
    build:
      context: .
      dockerfile: deploy/Dockerfile.signal-svc
    ports:
      - "8080:8080"
    environment:
      - PUBLIC_IP=${PUBLIC_IP:-127.0.0.1}
    depends_on:
      - media-svc
    restart: unless-stopped
