syntax = "proto3";
package media;
option go_package = "namecon/signal-svc/pkg/pb/media";

// ==========================================
// Service 定义 — Go ↔ C++ 的 8 个 RPC 接口
// ==========================================
service MediaService {
  rpc CreateRoom      (CreateRoomReq)       returns (CreateRoomResp);
  rpc DestroyRoom     (DestroyRoomReq)      returns (DestroyRoomResp);
  rpc AddPeer         (AddPeerReq)          returns (AddPeerResp);
  rpc RemovePeer      (RemovePeerReq)       returns (RemovePeerResp);
  rpc SendOffer       (SendOfferReq)        returns (SendOfferResp);
  rpc SendIceCandidate(SendIceCandidateReq) returns (SendIceCandidateResp);
  rpc MuteTrack       (MuteTrackReq)        returns (MuteTrackResp);
  rpc GetRoomStats    (RoomStatsReq)        returns (RoomStatsResp);

  // -- 流级转发关系管理（Consumer 模型，替代旧 AddForwarding） --
  rpc AddConsumer     (AddConsumerReq)      returns (AddConsumerResp);
  rpc RemoveConsumer  (RemoveConsumerReq)   returns (RemoveConsumerResp);
}

// ==========================================
// 请求 / 响应 Message 定义
// ==========================================

// -- 房间管理 --
message CreateRoomReq {
  string room_name = 1;
}

message CreateRoomResp {
  string room_id = 1;
  string token   = 2;
}

message DestroyRoomReq {
  string room_id = 1;
}

message DestroyRoomResp {
  bool success = 1;
}

// -- 参会者管理 --
message AddPeerReq {
  string peer_id = 1;    // 浏览器传来的用户标识
}

message AddPeerResp {
  string sfu_ip           = 1;
  int32  sfu_port         = 2;
  string ice_ufrag        = 3;  // ICE-lite ufrag (写入 SDP Answer)
  string ice_pwd          = 4;  // ICE-lite pwd  (写入 SDP Answer)
  string dtls_fingerprint = 5;  // SHA-256 指纹  (写入 SDP Answer)
}

message RemovePeerReq {
  string peer_id = 1;
}

message RemovePeerResp {
  bool success = 1;
}

// -- WebRTC 信令 --
message SendOfferReq {
  string room_id = 1;
  string peer_id = 2;
  string sdp     = 3;
  repeated RecvMid recv_mids = 4;  // 订阅者声明的 mid → publisher 映射
}

message RecvMid {
  string mid               = 1;  // 订阅者 SDP 里的 mid
  string publisher_peer_id = 2;  // 该 mid 接收谁的流
  bool   is_video          = 3;  // true=video, false=audio
}

message SendOfferResp {
  string answer_sdp = 1;
}

message SendIceCandidateReq {
  string room_id  = 1;
  string peer_id  = 2;
  string candidate = 3;
}

message SendIceCandidateResp {
  bool success = 1;
}

// -- 媒体控制 --
message MuteTrackReq {
  string room_id    = 1;
  string peer_id    = 2;
  bool   mute_audio = 3;
  bool   mute_video = 4;
}

message MuteTrackResp {
  bool success = 1;
}

// -- 统计 --
message RoomStatsReq {
  string room_id = 1;
}

message RoomStatsResp {
  int32 peer_count = 1;
}

// -- 流级转发关系管理（Consumer 模型） --
message AddConsumerReq {
  string subscriber_peer_id = 1;  // 接收方
  string publisher_peer_id  = 2;  // 发送方
  bool   is_video            = 3;
}
message AddConsumerResp {
  uint32 rewritten_ssrc = 1;    // SFU 分配的出口 SSRC
}

message RemoveConsumerReq {
  string subscriber_peer_id = 1;
  string publisher_peer_id  = 2;
  bool   is_video            = 3;
}
message RemoveConsumerResp {
  bool success = 1;
}
