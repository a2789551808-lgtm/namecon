version: "3.8"
services:
  media-svc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.media-svc
    ports:
      - "50051:50051"
      - "10000-20000:10000-20000/udp"
  signal-svc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.signal-svc
    ports:
      - "8080:8080"
      - "8081:8081"
  web:
    image: nginx:alpine
    volumes:
      - ../web:/usr/share/nginx/html
    ports:
      - "3000:80"
