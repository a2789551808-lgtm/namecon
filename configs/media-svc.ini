[server]
grpc_port = 50051
udp_port_start = 10000
udp_port_end = 20000
; 部署时改为公网IP，或通过环境变量 PUBLIC_IP 传入
public_ip = "127.0.0.1"

[dtls]
cert_file = "./certs/cert.pem"
key_file = "./certs/key.pem"

[ai]
enabled = false
vad_sensitivity = 2
summary_interval_min = 5

[log]
; 日志文件路径（可选），不填则仅输出到控制台
log_file = ""
; 单个日志文件最大大小（MB），超过则滚动，默认 10
log_max_size_mb = 10
; 保留最近 N 个备份文件，默认 5
log_max_backups = 5
; 备份文件最多保留 N 天，默认 30
log_max_age_days = 30
; 日志级别：debug / info / warn / error，默认 info
log_level = "info"
