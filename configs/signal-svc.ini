[server]
http_port = 8080
ws_port = 8081
cert_file = "/etc/namecon/cert.pem"
key_file = "/etc/namecon/key.pem"

[jwt]
secret = "change-me-in-production"
expire_hours = 24

[media_service]
; Docker 部署时改为 media-svc，本地开发用 127.0.0.1
host = "media-svc"
port = 50051

[log]
log_file = ""
log_max_size_mb = 10
log_max_backups = 5
log_max_age_days = 30
log_level = "info"
